spring:
  application:
    name: acme-salary-management

  datasource:
    # SQLite file. Override the location with APP_DB_PATH (e.g. /data/acme.db).
    # foreign_keys: SQLite leaves FK enforcement off unless enabled per connection.
    # journal_mode=WAL: readers are not blocked while a write is in progress.
    # busy_timeout: wait up to 5s for the single writer lock instead of failing immediately.
    # transaction_mode=IMMEDIATE: take the write lock at BEGIN. With the default (DEFERRED), two transactions
    #   can both read and then race to write; the loser gets SQLITE_BUSY instead of waiting. IMMEDIATE makes
    #   writers queue (then optimistic locking returns 409 if they touched the same employee). Cost: transactions
    #   run one at a time, which is negligible for a single HR team with millisecond queries.
    url: jdbc:sqlite:${APP_DB_PATH:acme.db}?foreign_keys=true&journal_mode=WAL&busy_timeout=5000&transaction_mode=IMMEDIATE
    hikari:
      maximum-pool-size: 4

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate     # Flyway owns the schema; Hibernate only checks the mapping matches
    properties:
      hibernate:
        dialect: com.acme.salary.common.persistence.AcmeSqliteDialect

  flyway:
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Demo data (US-17). Runs at start-up only when the employee table is empty, so restarts never duplicate it.
  # To start over, delete the SQLite file (acme.db) and restart. Turn off with APP_SEED_ENABLED=false.
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    employees: ${APP_SEED_EMPLOYEES:10000}
    random-seed: 42                 # fixed, so every run produces identical data
    reference-date: 2026-11-01      # the "today" the data is built around; not now(), for the same reason
    # Also write a sample file in the HR import format, e.g. APP_SEED_SAMPLE_CSV=samples/employees-sample.csv.
    # Its rows are extra people, so it imports cleanly into a seeded database. Blank = don't write one.
    sample-csv: ${APP_SEED_SAMPLE_CSV:}
    sample-csv-rows: 200
